services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_crm_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_crm
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_crm_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/erp_crm?schema=public"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-dev-access-secret-k8x9m2p4q7r1v3w5}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-dev-refresh-secret-n6t8b0c2d4e7f9g1}"
      JWT_ACCESS_EXPIRY: "${JWT_ACCESS_EXPIRY:-15m}"
      JWT_REFRESH_EXPIRY: "${JWT_REFRESH_EXPIRY:-7d}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"

volumes:
  pgdata:
